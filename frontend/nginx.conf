# 前端容器配置：静态托管 SPA，并把 /api 与 /health 反代到后端容器。
# 前端 axios 的 baseURL 是相对路径 "/api"，因此同源反代即可，无需 CORS。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端是 history 模式的客户端路由：找不到的路径一律回落到 index.html，
    # 否则刷新 /kbs/1/chat 这类页面会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式问答走 SSE：必须关掉响应缓冲，否则答案会被攒到最后一次性吐出，
        # 前端就看不到逐字生成的效果了。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 健康检查端点在后端根路径，不带 /api 前缀
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }
}
