# 前端容器配置：静态托管 SPA，并把 /api 与 /health 反代到后端容器。
# 前端 axios 的 baseURL 是相对路径 "/api"，因此同源反代即可，无需 CORS。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端是 history 模式的客户端路由：找不到的路径一律回落到 index.html，
    # 否则刷新 /kbs/1/chat 这类页面会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式问答走 SSE：必须关掉响应缓冲，否则答案会被攒到最后一次性吐出，
        # 前端就看不到逐字生成的效果了。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 健康检查端点在后端根路径，不带 /api 前缀
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # API 文档：Swagger UI / ReDoc / OpenAPI 描述。
    #
    # 为什么必须显式列出：这三条路径都不在 /api/ 前缀下，上面的 location / 会用
    # try_files 把它们兜底成前端 index.html —— 浏览器拿到的是**状态码 200 的错内容**
    # （RAG 首页而不是文档），只看"通不通"根本发现不了。
    #
    # 为什么三条要一起放：Swagger 页面自己会去拉 /openapi.json，只放 /docs 会打开
    # 一个"加载不到 API 定义"的空壳。ReDoc 是同一份描述的另一种渲染风格。
    # 注：后端本来就是开着文档的（FastAPI 默认），这里只是把交付入口放行，
    # 并非新开一个攻击面 —— 详见 docs/progress-log.md 2026-10-06。
    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
