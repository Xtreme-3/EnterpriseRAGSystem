name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖（后端 + API + 测试）
        run: pip install -e ".[dev,api,ocr]"
      - name: 后端测试（PG/真 Key 用例自动跳过；OCR 随 [ocr] extra 真跑）
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ⚠️ 必须与 package.json 的 engines 一致。node 20 上 jsdom 依赖链的
          # undici 7 会在 import 期崩（util.markAsUncloneable 不存在，
          # 11 个测试文件全 error、零用例执行）——CI 前端 job 自 10-06 上线起
          # 一直红着没人发现，根因即此（bugfix-log #51）。
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 前端测试
        run: npm test
      - name: 类型检查 + 构建
        run: npm run build
